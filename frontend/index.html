    <script>
      (function() {
        try {
          var saved = localStorage.getItem("bharatx-theme");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            // Default to Ivory / Soft Lavender White light mode
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>

    <!--
      Home only: start downloading the first hero slide (the LCP image) with the HTML instead of waiting for the app's
      JavaScript to render it. Keep this path in sync with the first slide in src/components/home/HomeHeroSection.tsx
      (and FIRST_SLIDE in src/utils/homeLoadOrder.ts).
    -->
    <script>
      if (location.pathname === "/") {
        var heroPreload = document.createElement("link");
        heroPreload.rel = "preload";
        heroPreload.as = "image";
        heroPreload.href = "/assets/slides/hero-ai-first.webp";
        heroPreload.setAttribute("fetchpriority", "high");
        document.head.appendChild(heroPreload);
      }
    </script>
